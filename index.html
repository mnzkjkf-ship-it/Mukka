<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂💖</title>
    <style>
        body {
            background: #ffe5ec;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255,117,143,0.3);
            max-width: 320px;
        }
        h1 { color: #ff758f; margin-bottom: 5px; }
        p { color: #800f2f; }
        .gift { font-size: 4rem; cursor: pointer; margin: 15px 0; }
        .msg { display: none; background: #fff0f3; padding: 15px; border-radius: 15px; color: #590d22; }
        button {
            background: #ff758f; color: white; border: none;
            padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Happy Birthday! 🎂</h1>
        <p>สุขสันต์วันเกิดนะคนเก่ง ✨</p>
        
        <div class="gift" onclick="openGift()">🎁</div>
        <p id="hint" style="font-size: 0.8rem;">(กดที่กล่องของขวัญเลย!)</p>

        <div class="msg" id="msg">
            💖 ขอให้มีความสุขมากๆ สุขภาพแข็งแรง ยิ้มเยอะๆ ในทุกวันนะคะ! 🌸
        </div><br>

        <button onclick="playMusic()">🎵 เปิดเพลงวันเกิด</button>
    </div>

    <script>
        function openGift() {
            document.querySelector('.gift').innerText = '🎂';
            document.getElementById('msg').style.display = 'block';
            document.getElementById('hint').innerText = '✨ มีความสุขมากๆ นะ! ✨';
            playMusic();
        }

        let audioCtx, isPlaying = false;
        function playMusic() {
            if (isPlaying) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isPlaying = true;
            let notes = [261.6, 261.6, 293.6, 261.6, 349.2, 329.6, 261.6, 261.6, 293.6, 261.6, 392.0, 349.2];
            let i = 0;
            setInterval(() => {
                let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = notes[i % notes.length];
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                i++;
            }, 380);
        }
    </script>
</body>
</html>
